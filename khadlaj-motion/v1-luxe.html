<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khadlaj – Hareem Al Sultan Gold</title>
<style>
  html, body { margin: 0; height: 100%; background: #050403; }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ------------------------------------------------------------------
// Textes modifiables
// ------------------------------------------------------------------
const CONFIG = {
  hook:      "L'Orient en une goutte.",
  hookSmall: "KHADLAJ PERFUMES",
  notes: [
    { label: "NOTES DE TÊTE",  items: ["Bergamote", "Jasmin", "Pivoine"] },
    { label: "NOTES DE CŒUR",  items: ["Ananas", "Prune", "Pêche"] },
    { label: "NOTES DE FOND",  items: ["Musc", "Santal", "Patchouli"] },
  ],
  macro:     "Une signature dorée.",
  name:      "HAREEM AL SULTAN",
  edition:   "GOLD",
  subtitle:  "Huile de parfum concentrée",
  family:    ["FLORAL", "FRUITÉ", "MUSQUÉ"],
  badge:     "BEST-SELLER • VIRAL SUR TIKTOK • ",
  brandAr:   "خدلج",
  brand:     "KHADLAJ",
  offer:     "Disponible dès maintenant en ligne",
  cta:       "COMMANDEZ MAINTENANT",
  url:       "khadlaj-perfumes.com",
};

const W = 1080, H = 1920, DUR = 24;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ------------------------------------------------------------------
// Utilitaires
// ------------------------------------------------------------------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeIn = k => k * k;
// fenêtre d'opacité : monte entre a et a+fi, descend entre b-fo et b
const win = (t, a, b, fi = .5, fo = .5) => Math.min(easeInOut(seg(t, a, a + fi)), 1 - easeInOut(seg(t, b - fo, b)));

function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let r = Math.imul(seed ^ seed >>> 15, 1 | seed);
    r = r + Math.imul(r ^ r >>> 7, 61 | r) ^ r;
    return ((r ^ r >>> 14) >>> 0) / 4294967296;
  };
}

const GOLD = '#d4ad5a', GOLD_LIGHT = '#f3dc9b', CHAMPAGNE = '#f6ead2';

function metal(c, x0, x1) {
  const g = c.createLinearGradient(x0, 0, x1, 0);
  g.addColorStop(0, '#5e400f'); g.addColorStop(.18, '#d9b465'); g.addColorStop(.34, '#fff2c6');
  g.addColorStop(.5, '#b4842e'); g.addColorStop(.7, '#f1d58c'); g.addColorStop(1, '#4f340b');
  return g;
}

function text(str, x, y, { font, color = CHAMPAGNE, alpha = 1, spacing = 0, align = 'center', base = 'middle' } = {}) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base;
  ctx.letterSpacing = spacing + 'px';
  // compensation de l'espacement final pour garder le texte centré
  ctx.fillText(str, align === 'center' ? x + spacing / 2 : x, y);
  ctx.restore();
}

// ------------------------------------------------------------------
// Éléments pré-calculés
// ------------------------------------------------------------------
const R = rng(7);
const dust = Array.from({ length: 150 }, () => ({ x: R() * W, y: R() * H, v: 20 + R() * 60, s: .8 + R() * 2.6, p: R() * 6.28, d: .3 + R() * .7 }));
const splash = Array.from({ length: 38 }, (_, i) => {
  const a = -Math.PI / 2 + (R() - .5) * 2.2;
  const sp = 500 + R() * 900;
  return { vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 3 + R() * 9 };
});
const petals = [0, 1, 2].map(() => Array.from({ length: 34 }, () => ({
  x: R() * W, y: R() * H, v: 40 + R() * 110, s: .5 + R() * 1.1, rot: R() * 6.28, vr: (R() - .5) * 1.6, sw: 20 + R() * 60, p: R() * 6.28, z: R(),
})));
const smoke = Array.from({ length: 16 }, () => ({ x: R() * W, y: 500 + R() * 1300, r: 260 + R() * 320, p: R() * 6.28, a: .035 + R() * .05 }));

const NOTE_STYLE = [
  { bg: ['#3a2a10', '#120c05'], cols: ['#f6d77a', '#f4c2cc', '#fff4dc'], shape: 'petal' },
  { bg: ['#3d1a20', '#120608'], cols: ['#f3a066', '#a24a7b', '#ffcf8f'], shape: 'orb'   },
  { bg: ['#2d1a0c', '#0c0704'], cols: ['#b9813f', '#6d4523', '#e0b57a'], shape: 'wisp'  },
];

// Motif arabesque (étoiles à 8 branches), estompé radialement
const pattern = document.createElement('canvas');
pattern.width = pattern.height = 2400;
(function () {
  const p = pattern.getContext('2d');
  p.strokeStyle = GOLD; p.lineWidth = 2;
  const step = 150;
  for (let y = -step; y < 2400 + step; y += step) for (let x = -step; x < 2400 + step; x += step) {
    for (const off of [0, Math.PI / 4]) {
      p.beginPath();
      for (let k = 0; k < 4; k++) {
        const a = off + k * Math.PI / 2;
        const px = x + Math.cos(a) * 52, py = y + Math.sin(a) * 52;
        k ? p.lineTo(px, py) : p.moveTo(px, py);
      }
      p.closePath(); p.stroke();
    }
    p.beginPath(); p.arc(x + step / 2, y + step / 2, 10, 0, 6.28); p.stroke();
  }
  p.globalCompositeOperation = 'destination-in';
  const g = p.createRadialGradient(1200, 1200, 0, 1200, 1200, 1150);
  g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(.55, 'rgba(0,0,0,.45)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  p.fillStyle = g; p.fillRect(0, 0, 2400, 2400);
})();

// Grain
const grains = [0, 1, 2, 3].map(i => {
  const g = document.createElement('canvas'); g.width = 540; g.height = 960;
  const gc = g.getContext('2d'); const img = gc.createImageData(540, 960); const r = rng(100 + i);
  for (let k = 0; k < img.data.length; k += 4) { const v = r() * 255; img.data[k] = img.data[k + 1] = img.data[k + 2] = v; img.data[k + 3] = 255; }
  gc.putImageData(img, 0, 0); return g;
});

// ------------------------------------------------------------------
// Flacon (dessiné dans un canvas à part : reflet + balayage lumineux)
// ------------------------------------------------------------------
const BW = 560, BH = 980, OX = 280, OY = 700; // origine = centre du corps
const bottleC = document.createElement('canvas'); bottleC.width = BW; bottleC.height = BH;
const reflC = document.createElement('canvas'); reflC.width = BW; reflC.height = BH;

function bodyPath(c, k = 1) {
  const hw = 210 * k, hh = 220 * k, ch = 72 * k;
  c.beginPath();
  c.moveTo(-hw + ch, -hh); c.lineTo(hw - ch, -hh); c.quadraticCurveTo(hw - ch * .2, -hh + ch * .2, hw, -hh + ch);
  c.lineTo(hw, hh - ch); c.quadraticCurveTo(hw - ch * .2, hh - ch * .2, hw - ch, hh);
  c.lineTo(-hw + ch, hh); c.quadraticCurveTo(-hw + ch * .2, hh - ch * .2, -hw, hh - ch);
  c.lineTo(-hw, -hh + ch); c.quadraticCurveTo(-hw + ch * .2, -hh + ch * .2, -hw + ch, -hh);
  c.closePath();
}
function capPath(c) {
  c.beginPath();
  c.moveTo(-86, -300);
  c.bezierCurveTo(-140, -360, -125, -450, -60, -520);
  c.bezierCurveTo(-30, -555, -12, -590, 0, -640);
  c.bezierCurveTo(12, -590, 30, -555, 60, -520);
  c.bezierCurveTo(125, -450, 140, -360, 86, -300);
  c.closePath();
}

function renderBottle(sweep) {
  const c = bottleC.getContext('2d');
  c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, BW, BH);
  c.translate(OX, OY);

  // corps : verre + jus doré
  const liq = c.createLinearGradient(0, -220, 0, 220);
  liq.addColorStop(0, '#ffe08e'); liq.addColorStop(.45, '#d8922f'); liq.addColorStop(1, '#6e350b');
  bodyPath(c); c.fillStyle = liq; c.fill();
  const edge = c.createLinearGradient(-210, 0, 210, 0);
  edge.addColorStop(0, 'rgba(40,15,0,.65)'); edge.addColorStop(.3, 'rgba(40,15,0,0)');
  edge.addColorStop(.7, 'rgba(40,15,0,0)'); edge.addColorStop(1, 'rgba(40,15,0,.7)');
  bodyPath(c); c.fillStyle = edge; c.fill();
  // facettes
  const inner = c.createLinearGradient(0, -160, 0, 160);
  inner.addColorStop(0, 'rgba(255,240,190,.55)'); inner.addColorStop(1, 'rgba(255,200,110,.08)');
  bodyPath(c, .72); c.fillStyle = inner; c.fill();
  c.strokeStyle = 'rgba(255,240,205,.35)'; c.lineWidth = 2;
  bodyPath(c, .72); c.stroke();
  const outerPts = [[-138, -220], [138, -220], [210, -148], [210, 148], [138, 220], [-138, 220], [-210, 148], [-210, -148]];
  c.beginPath();
  for (const [x, y] of outerPts) { c.moveTo(x, y); c.lineTo(x * .72, y * .72); }
  c.stroke();
  // reflet vertical
  const spec = c.createLinearGradient(-175, 0, -125, 0);
  spec.addColorStop(0, 'rgba(255,255,255,0)'); spec.addColorStop(.5, 'rgba(255,255,255,.45)'); spec.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = spec; c.fillRect(-175, -150, 50, 300);
  bodyPath(c); c.strokeStyle = metal(c, -210, 210); c.lineWidth = 6; c.stroke();

  // médaillon
  c.beginPath(); c.ellipse(0, 20, 104, 64, 0, 0, 6.28);
  c.fillStyle = 'rgba(28,12,2,.72)'; c.fill();
  c.strokeStyle = metal(c, -104, 104); c.lineWidth = 4; c.stroke();
  c.beginPath(); c.ellipse(0, 20, 92, 53, 0, 0, 6.28); c.lineWidth = 1.2; c.stroke();
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillStyle = GOLD_LIGHT; c.font = '500 24px Jost'; c.letterSpacing = '6px';
  c.fillText('KHADLAJ', 3, 8);
  c.font = '300 11px Jost'; c.letterSpacing = '3px'; c.fillStyle = CHAMPAGNE;
  c.fillText('HAREEM AL SULTAN', 1.5, 38);

  // col, bague, bouchon
  c.fillStyle = metal(c, -50, 50); c.fillRect(-50, -262, 100, 44);
  c.beginPath(); c.roundRect(-92, -304, 184, 46, 10); c.fillStyle = metal(c, -92, 92); c.fill();
  c.strokeStyle = 'rgba(70,40,5,.6)'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(-92, -281); c.lineTo(92, -281); c.stroke();
  capPath(c); c.fillStyle = metal(c, -130, 130); c.fill();
  c.save(); capPath(c); c.clip();
  c.strokeStyle = 'rgba(80,45,5,.55)'; c.lineWidth = 3;
  for (const y of [-340, -410, -480]) { c.beginPath(); c.moveTo(-140, y); c.lineTo(140, y); c.stroke(); }
  c.fillStyle = 'rgba(80,45,5,.5)';
  for (let k = -3; k <= 3; k++) { c.beginPath(); c.arc(k * 26, -375, 6, 0, 6.28); c.fill(); }
  c.restore();
  c.beginPath(); c.arc(0, -652, 15, 0, 6.28); c.fillStyle = metal(c, -15, 15); c.fill();

  // balayage lumineux (uniquement sur les pixels du flacon)
  if (sweep > -1 && sweep < 2) {
    c.globalCompositeOperation = 'source-atop';
    const sx = lerp(-520, 520, sweep);
    const g = c.createLinearGradient(sx - 140, -300, sx + 140, 300);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, 'rgba(255,250,230,.75)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g; c.fillRect(-OX, -OY, BW, BH);
    c.globalCompositeOperation = 'source-over';
  }

  // reflet au sol
  const rc = reflC.getContext('2d');
  rc.setTransform(1, 0, 0, 1, 0, 0); rc.clearRect(0, 0, BW, BH);
  rc.save(); rc.translate(0, BH); rc.scale(1, -1); rc.drawImage(bottleC, 0, 0); rc.restore();
  rc.globalCompositeOperation = 'destination-in';
  const fade = rc.createLinearGradient(0, BH - OY - 220, 0, BH - OY + 60);
  fade.addColorStop(0, 'rgba(0,0,0,.32)'); fade.addColorStop(1, 'rgba(0,0,0,0)');
  rc.fillStyle = fade; rc.fillRect(0, 0, BW, BH);
  rc.globalCompositeOperation = 'source-over';
}

function drawBottle(cx, cy, s, alpha, blur, sweep) {
  if (alpha <= 0) return;
  renderBottle(sweep);
  ctx.save();
  ctx.globalAlpha = alpha;
  // halo
  ctx.globalCompositeOperation = 'lighter';
  const halo = ctx.createRadialGradient(cx, cy - 120 * s, 0, cx, cy - 120 * s, 620 * s);
  halo.addColorStop(0, 'rgba(214,160,70,.32)'); halo.addColorStop(1, 'rgba(214,160,70,0)');
  ctx.fillStyle = halo; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';
  // sol brillant
  const floorY = cy + 220 * s;
  const fl = ctx.createRadialGradient(cx, floorY, 0, cx, floorY, 380 * s);
  fl.addColorStop(0, 'rgba(240,200,120,.35)'); fl.addColorStop(1, 'rgba(240,200,120,0)');
  ctx.save(); ctx.translate(cx, floorY); ctx.scale(1, .12); ctx.translate(-cx, -floorY);
  ctx.fillStyle = fl; ctx.beginPath(); ctx.arc(cx, floorY, 380 * s, 0, 6.28); ctx.fill(); ctx.restore();
  if (blur > .2) ctx.filter = `blur(${blur}px)`;
  ctx.drawImage(reflC, cx - OX * s, floorY - (BH - OY - 220) * s, BW * s, BH * s);
  ctx.drawImage(bottleC, cx - OX * s, cy - OY * s, BW * s, BH * s);
  ctx.restore();
}

// ------------------------------------------------------------------
// Couches d'ambiance
// ------------------------------------------------------------------
function background(t) {
  // mélange des teintes selon la scène
  let c0 = [16, 11, 6], c1 = [5, 4, 3];
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  NOTE_STYLE.forEach((st, i) => {
    const a = win(t, 3.4 + i * 2.2, 3.4 + (i + 1) * 2.2 + .4, .6, .6);
    c0 = c0.map((v, k) => lerp(v, hex(st.bg[0])[k], a));
    c1 = c1.map((v, k) => lerp(v, hex(st.bg[1])[k], a));
  });
  const warm = seg(t, 10, 12) * (1 - seg(t, 23.4, 24));
  c0 = c0.map((v, k) => lerp(v, [52, 34, 14][k], warm * .9));
  const g = ctx.createRadialGradient(W / 2, H * .45, 0, W / 2, H * .45, H * .75);
  g.addColorStop(0, `rgb(${c0.map(Math.round)})`); g.addColorStop(1, `rgb(${c1.map(Math.round)})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function drawDust(t, amount) {
  if (amount <= 0) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const d of dust) {
    const y = ((d.y - d.v * t) % H + H) % H;
    const x = d.x + Math.sin(t * .6 + d.p) * 18;
    const tw = .45 + .55 * Math.sin(t * 2.2 + d.p * 3);
    ctx.globalAlpha = amount * d.d * tw * .8;
    ctx.fillStyle = GOLD_LIGHT;
    ctx.beginPath(); ctx.arc(x, y, d.s, 0, 6.28); ctx.fill();
  }
  ctx.restore();
}

function drawSmoke(t, amount) {
  if (amount <= 0) return;
  ctx.save();
  for (const s of smoke) {
    const x = s.x + Math.sin(t * .15 + s.p) * 140;
    const y = s.y - t * 14 + Math.cos(t * .11 + s.p) * 90;
    const g = ctx.createRadialGradient(x, y, 0, x, y, s.r);
    g.addColorStop(0, `rgba(215,185,135,${s.a * amount})`); g.addColorStop(1, 'rgba(215,185,135,0)');
    ctx.fillStyle = g; ctx.fillRect(x - s.r, y - s.r, s.r * 2, s.r * 2);
  }
  ctx.restore();
}

function drawRays(t, amount) {
  if (amount <= 0) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 6; i++) {
    const ang = -.42 + i * .17 + Math.sin(t * .3 + i) * .03;
    const len = 2100, wdt = 70 + (i % 3) * 45;
    ctx.save(); ctx.translate(W / 2 + (i - 2.5) * 40, -120); ctx.rotate(ang);
    const g = ctx.createLinearGradient(0, 0, 0, len);
    g.addColorStop(0, `rgba(255,225,160,${.13 * amount})`); g.addColorStop(1, 'rgba(255,225,160,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(8, 0); ctx.lineTo(wdt, len); ctx.lineTo(-wdt, len); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function drawPattern(t, amount, cy) {
  if (amount <= 0) return;
  ctx.save(); ctx.globalAlpha = amount * .22;
  ctx.translate(W / 2, cy); ctx.rotate(t * .025);
  ctx.drawImage(pattern, -1200, -1200);
  ctx.restore();
}

// ------------------------------------------------------------------
// Scènes
// ------------------------------------------------------------------
function sceneHook(t) {
  const A = 1 - easeInOut(seg(t, 3.2, 3.9));
  if (A <= 0) return;
  ctx.save(); ctx.globalAlpha = A;
  const IMPACT = 1.6, impY = 1020;

  // goutte : formation puis chute
  if (t < IMPACT) {
    const grow = easeOut(seg(t, .2, .9));
    const fall = easeIn(seg(t, .9, IMPACT));
    const y = lerp(380, impY, fall), r = 24 * grow;
    const stretch = 1 + fall * .8;
    if (fall > 0) {
      const tr = ctx.createLinearGradient(0, y - 260 * fall, 0, y);
      tr.addColorStop(0, 'rgba(255,220,140,0)'); tr.addColorStop(1, 'rgba(255,220,140,.5)');
      ctx.fillStyle = tr; ctx.fillRect(W / 2 - 2, y - 260 * fall, 4, 260 * fall);
    }
    ctx.save(); ctx.translate(W / 2, y); ctx.scale(1, stretch);
    const g = ctx.createRadialGradient(-r * .3, -r * .3, 1, 0, 0, r * 1.2);
    g.addColorStop(0, '#fff3c8'); g.addColorStop(.4, '#f0c063'); g.addColorStop(1, '#8a4c10');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(0, -r * 2.1);
    ctx.bezierCurveTo(r * .5, -r * 1.2, r, -r * .4, r, 0);
    ctx.arc(0, 0, r, 0, Math.PI); ctx.bezierCurveTo(-r, -r * .4, -r * .5, -r * 1.2, 0, -r * 2.1);
    ctx.fill(); ctx.restore();
    // halo de la goutte
    ctx.globalCompositeOperation = 'lighter';
    const h = ctx.createRadialGradient(W / 2, y, 0, W / 2, y, 140);
    h.addColorStop(0, `rgba(255,200,110,${.35 * grow})`); h.addColorStop(1, 'rgba(255,200,110,0)');
    ctx.fillStyle = h; ctx.fillRect(W / 2 - 140, y - 140, 280, 280);
    ctx.globalCompositeOperation = 'source-over';
  } else {
    const dt = t - IMPACT;
    ctx.globalCompositeOperation = 'lighter';
    // flash
    const fa = Math.exp(-dt * 3.2);
    const f = ctx.createRadialGradient(W / 2, impY, 0, W / 2, impY, 700);
    f.addColorStop(0, `rgba(255,215,140,${.75 * fa})`); f.addColorStop(1, 'rgba(255,215,140,0)');
    ctx.fillStyle = f; ctx.fillRect(0, 0, W, H);
    // ondes
    for (let k = 0; k < 4; k++) {
      const d = dt - k * .18; if (d <= 0) continue;
      const rx = easeOut(clamp(d / 1.8)) * 560;
      ctx.strokeStyle = `rgba(243,220,155,${.7 * (1 - clamp(d / 1.8))})`; ctx.lineWidth = 3 - k * .5;
      ctx.beginPath(); ctx.ellipse(W / 2, impY, rx, rx * .16, 0, 0, 6.28); ctx.stroke();
    }
    // couronne de gouttelettes
    for (const p of splash) {
      const x = W / 2 + p.vx * dt * .55, y = impY + p.vy * dt * .55 + 1400 * dt * dt;
      const a = 1 - clamp(dt / 1.3);
      if (a <= 0 || y > impY + 20) continue;
      ctx.fillStyle = `rgba(250,215,130,${a})`;
      ctx.beginPath(); ctx.arc(x, y, p.r * (1 - dt * .4), 0, 6.28); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    // flaque
    const pool = ctx.createRadialGradient(W / 2, impY, 0, W / 2, impY, 300);
    pool.addColorStop(0, `rgba(220,160,60,${.55 * (1 - clamp(dt / 2.2))})`); pool.addColorStop(1, 'rgba(220,160,60,0)');
    ctx.save(); ctx.translate(W / 2, impY); ctx.scale(1, .14); ctx.translate(-W / 2, -impY);
    ctx.fillStyle = pool; ctx.beginPath(); ctx.arc(W / 2, impY, 300, 0, 6.28); ctx.fill(); ctx.restore();
  }

  const ta = easeOut(seg(t, 2.0, 2.8));
  text(CONFIG.hookSmall, W / 2, 620, { font: '300 30px Jost', color: GOLD_LIGHT, alpha: easeOut(seg(t, 2.3, 3.0)), spacing: lerp(26, 14, easeOut(seg(t, 2.3, 3.3))) });
  text(CONFIG.hook, W / 2, 1360 + (1 - ta) * 40, { font: 'italic 500 92px Cormorant', color: CHAMPAGNE, alpha: ta });
  ctx.restore();
}

function sceneNotes(t) {
  CONFIG.notes.forEach((n, i) => {
    const s = 3.4 + i * 2.2, e = s + 2.6;
    const A = win(t, s, e, .5, .5);
    if (A <= 0) return;
    const st = NOTE_STYLE[i], lt = t - s;
    ctx.save(); ctx.globalAlpha = A;

    // particules
    for (const p of petals[i]) {
      const z = .5 + p.z;
      const y = ((p.y - p.v * z * (t - s + 3)) % (H + 200) + H + 200) % (H + 200) - 100;
      const x = p.x + Math.sin(t * .9 + p.p) * p.sw;
      const col = st.cols[Math.floor(p.z * 3) % 3];
      ctx.save(); ctx.translate(x, y); ctx.rotate(p.rot + p.vr * t);
      ctx.globalAlpha = A * (.35 + p.z * .55);
      if (st.shape === 'petal') {
        const g = ctx.createLinearGradient(0, -30 * p.s, 0, 30 * p.s);
        g.addColorStop(0, col); g.addColorStop(1, 'rgba(255,255,255,.15)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.ellipse(0, 0, 16 * p.s * z, 34 * p.s * z, 0, 0, 6.28); ctx.fill();
      } else if (st.shape === 'orb') {
        const r = 30 * p.s * z;
        const g = ctx.createRadialGradient(-r * .3, -r * .3, 0, 0, 0, r);
        g.addColorStop(0, '#fff1d9'); g.addColorStop(.35, col); g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.28); ctx.fill();
      } else {
        const g = ctx.createLinearGradient(-90, 0, 90, 0);
        g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.5, col); g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g; ctx.globalAlpha *= .6;
        ctx.beginPath(); ctx.ellipse(0, 0, 120 * p.s * z, 8 * p.s * z, 0, 0, 6.28); ctx.fill();
      }
      ctx.restore();
    }

    // anneau doré qui se dessine
    const prog = easeInOut(seg(lt, .1, 2.2));
    ctx.strokeStyle = GOLD; ctx.lineWidth = 2; ctx.globalAlpha = A * .8;
    ctx.beginPath(); ctx.arc(W / 2, 960, 400, -Math.PI / 2, -Math.PI / 2 + prog * 6.283); ctx.stroke();
    ctx.globalAlpha = A;

    text('0' + (i + 1), W / 2, 640, { font: 'italic 500 44px Cormorant', color: GOLD, alpha: easeOut(seg(lt, .1, .6)) });
    text(n.label, W / 2, 720, { font: '300 30px Jost', color: GOLD_LIGHT, alpha: easeOut(seg(lt, .15, .7)), spacing: lerp(24, 12, easeOut(seg(lt, .1, 1.2))) });
    n.items.forEach((it, k) => {
      const a = easeOut(seg(lt, .3 + k * .18, .9 + k * .18));
      text(it, W / 2, 870 + k * 135 + (1 - a) * 30, { font: '500 112px Cormorant', color: CHAMPAGNE, alpha: a });
    });
    ctx.restore();
  });
}

// Position du flacon selon le temps (révélation → macro → infos → CTA)
function bottleState(t) {
  const appear = easeOut(seg(t, 10.3, 12.4));
  let cx = W / 2, cy = lerp(1010, 960, appear), s = lerp(1.14, 1, appear);
  // plan macro sur le bouchon
  const zin = easeInOut(seg(t, 13.8, 14.8)), zout = easeInOut(seg(t, 15.4, 16.4));
  const z = zin * (1 - zout);
  s *= 1 + z * .75; cy += z * 720;
  // mise en page infos puis CTA
  const toInfo = easeInOut(seg(t, 15.8, 17.0));
  cy = lerp(cy, 820, toInfo); s = lerp(s, .74, toInfo);
  const toCta = easeInOut(seg(t, 20.2, 21.2));
  cy = lerp(cy, 760, toCta); s = lerp(s, .66, toCta);
  cy += Math.sin(t * 1.3) * 6 * appear;
  return { cx, cy, s, alpha: appear * (1 - easeInOut(seg(t, 23.5, 24))), blur: (1 - easeOut(seg(t, 10.3, 12.0))) * 22, z };
}

function sweepAt(t) {
  for (const [a, b] of [[12.3, 13.5], [17.2, 18.3], [21.4, 22.5]]) if (t >= a && t <= b) return easeInOut(seg(t, a, b));
  return -2;
}

function goldText(str, x, y, font, spacing, alpha, shine) {
  if (alpha <= 0) return;
  ctx.save(); ctx.font = font; ctx.letterSpacing = spacing + 'px';
  const w = ctx.measureText(str).width;
  const g = ctx.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
  const p = clamp(shine, 0, 1);
  g.addColorStop(0, '#a87a2c'); g.addColorStop(clamp(p - .15), '#e6c375');
  g.addColorStop(p, '#fff6d6'); g.addColorStop(clamp(p + .15), '#e6c375'); g.addColorStop(1, '#a87a2c');
  ctx.restore();
  text(str, x, y, { font, color: g, alpha, spacing });
}

function sceneInfo(t) {
  const A = win(t, 16.6, 20.6, .4, .5);
  if (A <= 0) return;
  const lt = t - 16.6;
  ctx.save(); ctx.globalAlpha = A;
  const a1 = easeOut(seg(lt, 0, .8)), a2 = easeOut(seg(lt, .3, 1.1)), a3 = easeOut(seg(lt, .7, 1.4));
  text(CONFIG.name, W / 2, 1330, { font: '500 84px Cormorant', alpha: a1, spacing: lerp(30, 10, easeOut(seg(lt, 0, 1.6))) });
  goldText(CONFIG.edition, W / 2, 1465 + (1 - a2) * 30, '500 170px Cormorant', 34, a2, seg(lt, .8, 2.4) * 1.3 - .15);
  text(CONFIG.subtitle, W / 2, 1585, { font: '300 40px Jost', color: CHAMPAGNE, alpha: a3, spacing: 3 });
  // pastilles
  const pw = 230, gap = 26, total = CONFIG.family.length * pw + (CONFIG.family.length - 1) * gap;
  CONFIG.family.forEach((f, k) => {
    const a = easeOut(seg(lt, 1.0 + k * .15, 1.6 + k * .15));
    const x = W / 2 - total / 2 + k * (pw + gap);
    ctx.save(); ctx.globalAlpha = A * a;
    ctx.strokeStyle = GOLD; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.roundRect(x, 1665 + (1 - a) * 20, pw, 64, 32); ctx.stroke();
    ctx.restore();
    text(f, x + pw / 2, 1698 + (1 - a) * 20, { font: '500 26px Jost', color: GOLD_LIGHT, alpha: a, spacing: 6 });
  });
  // tampon tournant
  const ba = easeOut(seg(lt, .9, 1.6));
  if (ba > 0) {
    const bx = 840, by = 470, r = 108;
    ctx.save(); ctx.globalAlpha = A * ba; ctx.translate(bx, by);
    ctx.scale(lerp(.6, 1, ba), lerp(.6, 1, ba));
    ctx.fillStyle = 'rgba(20,12,4,.55)'; ctx.beginPath(); ctx.arc(0, 0, r + 16, 0, 6.28); ctx.fill();
    ctx.strokeStyle = GOLD; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, r + 16, 0, 6.28); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, r - 26, 0, 6.28); ctx.lineWidth = 1; ctx.stroke();
    ctx.rotate(t * .5);
    ctx.font = '500 21px Jost'; ctx.fillStyle = GOLD_LIGHT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const chars = [...CONFIG.badge];
    chars.forEach((ch, k) => {
      ctx.save(); ctx.rotate(k / chars.length * 6.283); ctx.translate(0, -r + 6); ctx.fillText(ch, 0, 0); ctx.restore();
    });
    ctx.restore();
    text('★', bx, by + 2, { font: '500 54px Jost', color: GOLD_LIGHT, alpha: A * ba });
  }
  ctx.restore();
}

function sceneMacro(t) {
  const A = win(t, 14.2, 15.8, .4, .4);
  text(CONFIG.macro, W / 2, 330, { font: 'italic 500 80px Cormorant', color: CHAMPAGNE, alpha: A });
}

function sceneCta(t) {
  const A = win(t, 20.6, 24.0, .5, .5);
  if (A <= 0) return;
  const lt = t - 20.6;
  ctx.save(); ctx.globalAlpha = A;
  const a0 = easeOut(seg(lt, 0, .7)), a1 = easeOut(seg(lt, .2, 1.0)), a2 = easeOut(seg(lt, .5, 1.2)), a3 = easeOut(seg(lt, .7, 1.4));
  goldText(CONFIG.brandAr, W / 2, 1150 + (1 - a0) * 20, '700 96px Amiri', 0, a0, seg(lt, .4, 2.0) * 1.3 - .15);
  text(CONFIG.brand, W / 2, 1275, { font: '500 104px Cormorant', alpha: a1, spacing: lerp(46, 26, easeOut(seg(lt, .1, 1.6))) });
  text(CONFIG.offer, W / 2, 1405, { font: '300 36px Jost', color: GOLD_LIGHT, alpha: a2, spacing: 2 });

  // bouton
  const pulse = 1 + Math.sin(Math.max(0, lt - 1.2) * 4.2) * .025 * seg(lt, 1.2, 1.5);
  const bw = 760, bh = 136, by = 1530;
  ctx.save(); ctx.globalAlpha = A * a3;
  ctx.translate(W / 2, by + bh / 2 + (1 - a3) * 30); ctx.scale(pulse, pulse);
  const gl = ctx.createRadialGradient(0, 0, 0, 0, 0, 520);
  gl.addColorStop(0, 'rgba(230,180,90,.35)'); gl.addColorStop(1, 'rgba(230,180,90,0)');
  ctx.fillStyle = gl; ctx.fillRect(-520, -300, 1040, 600);
  ctx.beginPath(); ctx.roundRect(-bw / 2, -bh / 2, bw, bh, bh / 2);
  ctx.fillStyle = metal(ctx, -bw / 2, bw / 2); ctx.fill();
  ctx.save(); ctx.clip();
  const sp = ((lt - 1.0) % 1.6) / 1.6;
  if (lt > 1.0) {
    const sx = lerp(-bw, bw, sp);
    const g = ctx.createLinearGradient(sx - 120, 0, sx + 120, 0);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, 'rgba(255,255,255,.7)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(-bw / 2, -bh / 2, bw, bh);
  }
  ctx.restore();
  ctx.font = '500 40px Jost'; ctx.letterSpacing = '5px'; ctx.fillStyle = '#2a1805';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(CONFIG.cta + '  →', 2.5, 2);
  ctx.restore();

  text(CONFIG.url, W / 2, 1740, { font: '300 38px Jost', color: CHAMPAGNE, alpha: easeOut(seg(lt, 1.0, 1.7)), spacing: 4 });
  ctx.restore();
}

// ------------------------------------------------------------------
// Image complète à l'instant t
// ------------------------------------------------------------------
function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  background(t);

  const bs = bottleState(t);
  const amb = seg(t, 10.2, 11.8) * (1 - easeInOut(seg(t, 23.4, 24)));
  drawPattern(t, amb * (1 - bs.z), bs.cy - 120 * bs.s);
  drawRays(t, amb);
  drawSmoke(t, amb + win(t, 0, 3.8, .6, .6) * .5);
  drawDust(t, .35 + amb * .65);

  sceneHook(t);
  sceneNotes(t);
  drawBottle(bs.cx, bs.cy, bs.s, bs.alpha, bs.blur, sweepAt(t));
  sceneMacro(t);
  sceneInfo(t);
  sceneCta(t);

  // vignette + grain + fondu d'entrée
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .72);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.6)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = .045; ctx.globalCompositeOperation = 'overlay';
  ctx.drawImage(grains[Math.floor(t * 24) % 4], 0, 0, W, H); ctx.restore();
  const fin = 1 - seg(t, 0, .4), fout = seg(t, 23.6, 24);
  if (fin + fout > 0) { ctx.fillStyle = `rgba(0,0,0,${Math.max(fin, fout)})`; ctx.fillRect(0, 0, W, H); }
}

// ------------------------------------------------------------------
// Lecture (boucle) ou rendu image par image (?render)
// ------------------------------------------------------------------
const FONTS = [
  ['Cormorant', 'fonts/cormorant-500.woff2', { weight: '500' }],
  ['Cormorant', 'fonts/cormorant-500i.woff2', { weight: '500', style: 'italic' }],
  ['Jost', 'fonts/jost-300.woff2', { weight: '300' }],
  ['Jost', 'fonts/jost-500.woff2', { weight: '500' }],
  ['Amiri', 'fonts/amiri-700-ar.woff2', { weight: '700' }],
];
window.ready = Promise.all(FONTS.map(([f, u, d]) => new FontFace(f, `url(${u})`, d).load().then(ff => document.fonts.add(ff))));
window.renderAt = t => draw(t);
window.DURATION = DUR;

if (!location.search.includes('render')) {
  window.ready.then(() => {
    let t0 = performance.now();
    cv.addEventListener('click', () => { t0 = performance.now(); });
    (function loop(now) {
      draw(((now - t0) / 1000) % DUR);
      requestAnimationFrame(loop);
    })(performance.now());
  });
}
</script>

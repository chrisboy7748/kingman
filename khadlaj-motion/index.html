<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khadlaj – Hareem Al Sultan Gold (social)</title>
<style>
  html, body { margin: 0; height: 100%; background: #0c0410; }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ------------------------------------------------------------------
// Textes modifiables
// ------------------------------------------------------------------
const CONFIG = {
  hook:    ["LE PARFUM", "QUI A FAIT", "CRAQUER", "TIKTOK"],
  kicker:  "KHADLAJ PERFUMES",
  badge:   "BEST-SELLER",
  name1:   "HAREEM",
  name2:   "AL SULTAN",
  edition: "Gold",
  format:  ["HUILE DE PARFUM", "CONCENTRÉE"],
  notes: [
    { label: "NOTES DE TÊTE", items: ["BERGAMOTE", "JASMIN", "PIVOINE"] },
    { label: "NOTES DE CŒUR", items: ["ANANAS", "PRUNE", "PÊCHE"] },
    { label: "NOTES DE FOND", items: ["MUSC", "SANTAL", "PATCHOULI"] },
  ],
  family:  ["FLORAL.", "FRUITÉ.", "MUSQUÉ."],
  band1:   "VIRAL SUR TIKTOK  •  ",
  band2:   "HAREEM AL SULTAN GOLD  •  ",
  brandAr: "خدلج",
  brand:   "KHADLAJ",
  cta1:    "COMMANDE-LE",
  cta2:    "maintenant",
  button:  "COMMANDER  →",
  url:     "khadlaj-perfumes.com",
  sticker: "DISPO EN LIGNE",
  price:   "",   // ex. "29,90 €" : remplace la pastille « DISPO EN LIGNE » par le prix
};

const W = 1080, H = 1920, DUR = 15, BEAT = .5; // 120 BPM
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const INK = '#16061c', PLUM = '#3e0b55', PINK = '#ff2f7d', GOLD = '#ffc21a',
      CREAM = '#fff3dc', ORANGE = '#ff6b1a', LEMON = '#ffe14d';

// ------------------------------------------------------------------
// Utilitaires
// ------------------------------------------------------------------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeIn = k => k * k * k;
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeOutBack = k => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const sinceBeat = t => t - Math.floor(t / BEAT) * BEAT;

function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let r = Math.imul(seed ^ seed >>> 15, 1 | seed);
    r = r + Math.imul(r ^ r >>> 7, 61 | r) ^ r;
    return ((r ^ r >>> 14) >>> 0) / 4294967296;
  };
}

function fill(color) { ctx.fillStyle = color; ctx.fillRect(-300, -300, W + 600, H + 600); }

function fit(str, font, maxW, maxSize, spacing = 0) {
  ctx.save(); ctx.font = font.replace('$', 100); ctx.letterSpacing = spacing + 'px';
  const w = ctx.measureText(str).width; ctx.restore();
  return Math.min(maxSize, 100 * maxW / w);
}

// Texte animé. anim : 'slam' (arrive en grand et claque), 'up' (monte derrière un masque), 'pop'
function T(str, x, y, o) {
  const t0 = o.t0 ?? -99, k = seg(o.t, t0, t0 + (o.dur || .2));
  if (k <= 0) return;
  let sc = 1, dy = 0, a = o.alpha ?? 1;
  if (o.anim === 'slam') { sc = lerp(1.9, 1, easeOutBack(k)); a *= clamp(k * 5); }
  if (o.anim === 'up') dy = (1 - easeOut(k)) * o.size * 1.15;
  if (o.anim === 'pop') sc = Math.max(0, easeOutBack(k));
  ctx.save();
  ctx.globalAlpha *= a;
  ctx.translate(x, y); if (o.rot) ctx.rotate(o.rot); ctx.scale(sc, sc);
  ctx.font = `${o.style || 'normal'} ${o.weight || 400} ${o.size}px ${o.fam || 'Anton'}`;
  ctx.textAlign = o.align || 'left'; ctx.textBaseline = 'middle';
  ctx.letterSpacing = (o.spacing || 0) + 'px';
  if (o.anim === 'up') { ctx.beginPath(); ctx.rect(-3000, -o.size * .62, 6000, o.size * 1.24); ctx.clip(); }
  const so = o.shadowOff ?? Math.max(6, o.size * .05);
  if (o.shadow) { ctx.fillStyle = o.shadow; ctx.fillText(str, so, so + dy); }
  if (o.stroke) { ctx.strokeStyle = o.stroke; ctx.lineWidth = o.lw || 3; ctx.lineJoin = 'round'; ctx.strokeText(str, 0, dy); }
  if (o.color) { ctx.fillStyle = o.color; ctx.fillText(str, 0, dy); }
  ctx.restore();
}

function marquee(str, y, size, speed, t, o) {
  ctx.save();
  ctx.font = `${o.size2 || ''} ${size}px ${o.fam || 'Anton'}`; ctx.textBaseline = 'middle';
  const w = ctx.measureText(str).width;
  let x = -(((t * speed) % w) + w) % w - w;
  ctx.globalAlpha *= o.alpha ?? 1;
  for (; x < W + w; x += w) {
    if (o.stroke) { ctx.strokeStyle = o.stroke; ctx.lineWidth = o.lw || 3; ctx.strokeText(str, x, y); }
    if (o.color) { ctx.fillStyle = o.color; ctx.fillText(str, x, y); }
  }
  ctx.restore();
}

function band(y, ang, h, bg, str, color, speed, t) {
  ctx.save(); ctx.translate(W / 2, y); ctx.rotate(ang); ctx.translate(-W / 2, 0);
  ctx.fillStyle = bg; ctx.fillRect(-400, -h / 2, W + 800, h);
  ctx.save(); ctx.translate(-300, 0); marquee(str, 4, h * .62, speed, t, { color }); ctx.restore();
  ctx.restore();
}

function star(x, y, r, rot, color) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.fillStyle = color;
  ctx.beginPath();
  for (let k = 0; k < 8; k++) {
    const rr = k % 2 ? r * .28 : r, a = k * Math.PI / 4;
    k ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.moveTo(rr, 0);
  }
  ctx.closePath(); ctx.fill(); ctx.restore();
}

function pill(x, y, str, { bg, color, size = 36, rot = 0, k = 1, padX = 34, padY = 20, fam = 'Jost', weight = 500, spacing = 4 }) {
  if (k <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); const sc = Math.max(0, easeOutBack(k)); ctx.scale(sc, sc);
  ctx.font = `${weight} ${size}px ${fam}`; ctx.letterSpacing = spacing + 'px';
  const w = ctx.measureText(str).width + padX * 2, h = size + padY * 2;
  ctx.fillStyle = INK; ctx.beginPath(); ctx.roundRect(-w / 2 + 8, -h / 2 + 8, w, h, h / 2); ctx.fill();
  ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, h / 2); ctx.fill();
  ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(str, spacing / 2, 2);
  ctx.restore();
}

// ------------------------------------------------------------------
// Flacon (illustration) + silhouette pour contour « sticker » et ombre portée
// ------------------------------------------------------------------
const BW = 560, BH = 980, OX = 280, OY = 700;
const bottleC = document.createElement('canvas'); bottleC.width = BW; bottleC.height = BH;
const silC = document.createElement('canvas'); silC.width = BW; silC.height = BH;

function metal(c, x0, x1) {
  const g = c.createLinearGradient(x0, 0, x1, 0);
  g.addColorStop(0, '#5e400f'); g.addColorStop(.18, '#d9b465'); g.addColorStop(.34, '#fff2c6');
  g.addColorStop(.5, '#b4842e'); g.addColorStop(.7, '#f1d58c'); g.addColorStop(1, '#4f340b');
  return g;
}
function bodyPath(c, k = 1) {
  const hw = 210 * k, hh = 220 * k, ch = 72 * k;
  c.beginPath();
  c.moveTo(-hw + ch, -hh); c.lineTo(hw - ch, -hh); c.quadraticCurveTo(hw - ch * .2, -hh + ch * .2, hw, -hh + ch);
  c.lineTo(hw, hh - ch); c.quadraticCurveTo(hw - ch * .2, hh - ch * .2, hw - ch, hh);
  c.lineTo(-hw + ch, hh); c.quadraticCurveTo(-hw + ch * .2, hh - ch * .2, -hw, hh - ch);
  c.lineTo(-hw, -hh + ch); c.quadraticCurveTo(-hw + ch * .2, -hh + ch * .2, -hw + ch, -hh);
  c.closePath();
}
function capPath(c) {
  c.beginPath();
  c.moveTo(-86, -300);
  c.bezierCurveTo(-140, -360, -125, -450, -60, -520);
  c.bezierCurveTo(-30, -555, -12, -590, 0, -640);
  c.bezierCurveTo(12, -590, 30, -555, 60, -520);
  c.bezierCurveTo(125, -450, 140, -360, 86, -300);
  c.closePath();
}
function renderBottle(sweep) {
  const c = bottleC.getContext('2d');
  c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, BW, BH); c.translate(OX, OY);
  const liq = c.createLinearGradient(0, -220, 0, 220);
  liq.addColorStop(0, '#ffe38f'); liq.addColorStop(.45, '#e9962a'); liq.addColorStop(1, '#8a3a06');
  bodyPath(c); c.fillStyle = liq; c.fill();
  const edge = c.createLinearGradient(-210, 0, 210, 0);
  edge.addColorStop(0, 'rgba(60,15,0,.6)'); edge.addColorStop(.3, 'rgba(60,15,0,0)');
  edge.addColorStop(.7, 'rgba(60,15,0,0)'); edge.addColorStop(1, 'rgba(60,15,0,.65)');
  bodyPath(c); c.fillStyle = edge; c.fill();
  const inner = c.createLinearGradient(0, -160, 0, 160);
  inner.addColorStop(0, 'rgba(255,245,200,.6)'); inner.addColorStop(1, 'rgba(255,200,110,.08)');
  bodyPath(c, .72); c.fillStyle = inner; c.fill();
  c.strokeStyle = 'rgba(255,240,205,.4)'; c.lineWidth = 2; bodyPath(c, .72); c.stroke();
  c.beginPath();
  for (const [x, y] of [[-138, -220], [138, -220], [210, -148], [210, 148], [138, 220], [-138, 220], [-210, 148], [-210, -148]]) { c.moveTo(x, y); c.lineTo(x * .72, y * .72); }
  c.stroke();
  const spec = c.createLinearGradient(-175, 0, -125, 0);
  spec.addColorStop(0, 'rgba(255,255,255,0)'); spec.addColorStop(.5, 'rgba(255,255,255,.5)'); spec.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = spec; c.fillRect(-175, -150, 50, 300);
  bodyPath(c); c.strokeStyle = metal(c, -210, 210); c.lineWidth = 6; c.stroke();
  c.beginPath(); c.ellipse(0, 20, 104, 64, 0, 0, 6.28); c.fillStyle = 'rgba(28,8,20,.8)'; c.fill();
  c.strokeStyle = metal(c, -104, 104); c.lineWidth = 4; c.stroke();
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillStyle = '#ffd98a'; c.font = '500 24px Jost'; c.letterSpacing = '6px'; c.fillText('KHADLAJ', 3, 8);
  c.font = '500 11px Jost'; c.letterSpacing = '3px'; c.fillStyle = CREAM; c.fillText('HAREEM AL SULTAN', 1.5, 38);
  c.fillStyle = metal(c, -50, 50); c.fillRect(-50, -262, 100, 44);
  c.beginPath(); c.roundRect(-92, -304, 184, 46, 10); c.fillStyle = metal(c, -92, 92); c.fill();
  c.strokeStyle = 'rgba(70,40,5,.6)'; c.lineWidth = 2; c.beginPath(); c.moveTo(-92, -281); c.lineTo(92, -281); c.stroke();
  capPath(c); c.fillStyle = metal(c, -130, 130); c.fill();
  c.save(); capPath(c); c.clip();
  c.strokeStyle = 'rgba(80,45,5,.55)'; c.lineWidth = 3;
  for (const y of [-340, -410, -480]) { c.beginPath(); c.moveTo(-140, y); c.lineTo(140, y); c.stroke(); }
  c.fillStyle = 'rgba(80,45,5,.5)';
  for (let k = -3; k <= 3; k++) { c.beginPath(); c.arc(k * 26, -375, 6, 0, 6.28); c.fill(); }
  c.restore();
  c.beginPath(); c.arc(0, -652, 15, 0, 6.28); c.fillStyle = metal(c, -15, 15); c.fill();
  if (sweep >= 0 && sweep <= 1) {
    c.globalCompositeOperation = 'source-atop';
    const sx = lerp(-520, 520, sweep);
    const g = c.createLinearGradient(sx - 120, -300, sx + 120, 300);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, 'rgba(255,255,240,.85)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g; c.fillRect(-OX, -OY, BW, BH);
    c.globalCompositeOperation = 'source-over';
  }
}
function silhouette(color) {
  const s = silC.getContext('2d');
  s.globalCompositeOperation = 'source-over'; s.clearRect(0, 0, BW, BH); s.drawImage(bottleC, 0, 0);
  s.globalCompositeOperation = 'source-in'; s.fillStyle = color; s.fillRect(0, 0, BW, BH);
  s.globalCompositeOperation = 'source-over';
  return silC;
}
function drawBottle(cx, cy, s, { rot = 0, sweep = -1, outline = CREAM, shadow = 'rgba(22,6,28,.45)' } = {}) {
  renderBottle(sweep);
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot);
  const dx = -OX * s, dy = -OY * s, w = BW * s, h = BH * s;
  if (shadow) ctx.drawImage(silhouette(shadow), dx + 30 * s, dy + 34 * s, w, h);
  if (outline) {
    const sil = silhouette(outline), o = 10 * s;
    for (let a = 0; a < 6.28; a += Math.PI / 6) ctx.drawImage(sil, dx + Math.cos(a) * o, dy + Math.sin(a) * o, w, h);
  }
  ctx.drawImage(bottleC, dx, dy, w, h);
  ctx.restore();
}

// ------------------------------------------------------------------
// Scènes (rythme : 1 temps = 0,5 s)
// ------------------------------------------------------------------
const R = rng(11);
const burst = Array.from({ length: 14 }, (_, i) => ({ a: i / 14 * 6.283 + R() * .3, v: 500 + R() * 700, r: 18 + R() * 30, spin: (R() - .5) * 8 }));
const confetti = [0, 1, 2].map(() => Array.from({ length: 16 }, () => ({
  x: R() * W, y: 200 + R() * 1500, vx: (R() - .5) * 160, vy: -60 - R() * 180, r: 14 + R() * 34, rot: R() * 6.28, spin: (R() - .5) * 5, type: Math.floor(R() * 4), c: R() < .5 ? 0 : 1,
})));
const sparkles = Array.from({ length: 12 }, () => ({ x: 120 + R() * 840, y: 380 + R() * 1200, r: 16 + R() * 26, p: R() * 6.28 }));

function hook(t) {
  const i = Math.min(3, Math.floor(t / BEAT)), t0 = i * BEAT;
  const bgs = [INK, PLUM, PINK, GOLD], cols = [CREAM, GOLD, CREAM, INK], shs = [PINK, PINK, INK, PINK];
  fill(bgs[i]);
  const font = '400 $px Anton';
  const word = CONFIG.hook[i], size = fit(word, font, 940, 400);
  if (i >= 2) {
    // échos en contour au-dessus et en dessous
    for (const d of [-1, 1]) for (const n of [1, 2]) T(word, W / 2, 900 + d * n * size * .92, { t, size, align: 'center', stroke: cols[i], lw: 3, alpha: .35 / n });
  }
  T(word, W / 2, 900, { t, t0, anim: i < 2 ? 'up' : 'slam', size, align: 'center', color: cols[i], shadow: shs[i], dur: i < 2 ? .22 : .2 });
  T(CONFIG.kicker, W / 2, 330, { t, size: 34, fam: 'Jost', weight: 500, align: 'center', color: cols[i], spacing: 12, alpha: .85 });
  if (i === 3) {
    const dt = t - t0;
    burst.forEach((b, k) => {
      const d = easeOut(clamp(dt / .5)) * b.v * .7;
      star(W / 2 + Math.cos(b.a) * d, 900 + Math.sin(b.a) * d, b.r * (1 - clamp(dt / .55) * .6), b.spin * dt, k % 2 ? PINK : INK);
    });
  }
}

function bottleDrop(t) {
  fill(GOLD);
  const rows = [380, 760, 1140, 1520];
  rows.forEach((y, k) => marquee(CONFIG.name1 + ' • ', y, 330, k % 2 ? -520 : 520, t, { stroke: INK, lw: 3, alpha: .2 }));
  const fall = easeIn(seg(t, 2.0, 2.25)), dt = Math.max(0, t - 2.25);
  const cy = lerp(-700, 1060, fall) - (t > 2.25 ? Math.abs(Math.sin(dt * 11)) * 90 * Math.exp(-dt * 7) : 0);
  // ombre au sol
  ctx.save(); ctx.fillStyle = 'rgba(22,6,28,.25)';
  ctx.beginPath(); ctx.ellipse(W / 2 + 20, 1300, 260 * fall, 34 * fall, 0, 0, 6.28); ctx.fill(); ctx.restore();
  drawBottle(W / 2, cy, 1.0, { rot: (1 - fall) * .25 + Math.sin(dt * 11) * .05 * Math.exp(-dt * 6), sweep: seg(t, 2.45, 2.9) || -1 });
  pill(300, 560, CONFIG.badge, { bg: PINK, color: CREAM, rot: -.14, k: seg(t, 2.4, 2.6), size: 40 });
  if (t > 2.25) for (let k = 0; k < 4; k++) star(260 + k * 190, 1420 + (k % 2) * 60, 22 * Math.max(0, 1 - dt * 1.5), dt * 3 + k, INK);
}

function nameCard(t) {
  fill(PLUM);
  marquee(CONFIG.name2 + ' • ', 1720, 200, -380, t, { stroke: GOLD, lw: 2, alpha: .25 });
  const s1 = fit(CONFIG.name1, '400 $px Anton', 780, 330);
  T(CONFIG.name1, 70, 560, { t, t0: 3.0, anim: 'slam', size: s1, color: GOLD, shadow: PINK });
  T(CONFIG.name2, 70, 815, { t, t0: 3.125, anim: 'up', size: s1 * .66, color: CREAM });
  T(CONFIG.edition, 100, 1060, { t, t0: 3.25, anim: 'slam', size: 330, fam: 'Playfair Display', style: 'italic', weight: 900, color: PINK, shadow: GOLD, rot: -.12 });
  CONFIG.format.forEach((f, k) => T(f, 76, 1300 + k * 52, { t, t0: 3.5 + k * .06, anim: 'up', size: 38, fam: 'Jost', weight: 500, color: CREAM, spacing: 4 }));
  const k = easeOutBack(seg(t, 3.0, 3.35));
  drawBottle(lerp(1400, 870, k), 1530, .64, { rot: .17 + Math.sin(t * 4) * .02, outline: GOLD });
}

const NOTE_LOOK = [
  { bg: LEMON, text: INK,   accent: PINK,  shadow: ORANGE },
  { bg: PINK,  text: CREAM, accent: GOLD,  shadow: PLUM   },
  { bg: PLUM,  text: GOLD,  accent: PINK,  shadow: INK    },
];
function noteCard(i, t) {
  const L = NOTE_LOOK[i], n = CONFIG.notes[i], s = 4.0 + i * 1.5, lt = t - s;
  fill(L.bg);
  T('0' + (i + 1), W - 30, 430 + lt * 30, { t, size: 640, align: 'right', stroke: L.accent, lw: 5, alpha: .6 });
  for (const c of confetti[i]) {
    const x = c.x + c.vx * lt, y = c.y + c.vy * lt, col = c.c ? L.accent : L.text;
    ctx.save(); ctx.translate(x, y); ctx.rotate(c.rot + c.spin * lt); ctx.globalAlpha = .9;
    ctx.fillStyle = ctx.strokeStyle = col; ctx.lineWidth = 7;
    if (c.type === 0) { ctx.beginPath(); ctx.arc(0, 0, c.r * .6, 0, 6.28); ctx.fill(); }
    else if (c.type === 1) { ctx.beginPath(); ctx.arc(0, 0, c.r * .7, 0, 6.28); ctx.stroke(); }
    else if (c.type === 2) { ctx.restore(); star(x, y, c.r, c.rot + c.spin * lt, col); continue; }
    else { ctx.beginPath(); ctx.arc(0, 0, c.r * .8, 0, Math.PI); ctx.fill(); }
    ctx.restore();
  }
  pill(260, 330, n.label, { bg: L.text, color: L.bg, rot: -.05, k: seg(t, s + .04, s + .22) });
  const size = Math.min(...n.items.map(w => fit(w, '400 $px Anton', 900, 240)));
  n.items.forEach((w, k) => T(w, 70, 620 + k * 235, { t, t0: s + .12 + k * .25, anim: k % 2 ? 'up' : 'slam', size, color: L.text, shadow: L.shadow }));
  const kb = easeOutBack(seg(t, s, s + .3));
  drawBottle(860, lerp(2300, 1660, kb), .62, { rot: (i % 2 ? -.2 : .2) + Math.sin(t * 5) * .03, outline: i === 2 ? GOLD : CREAM });
}
function notes(t) {
  const i = Math.min(2, Math.floor((t - 4.0) / 1.5)), s = 4.0 + i * 1.5;
  const p = easeOut(seg(t, s, s + .2));
  if (p < 1) {
    i === 0 ? nameCard(t) : noteCard(i - 1, t);
    // volet diagonal
    ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(-.35);
    ctx.beginPath(); ctx.rect(-1400, -1400, lerp(0, 2800, p), 2800); ctx.restore(); ctx.save(); ctx.clip();
    noteCard(i, t); ctx.restore();
  } else noteCard(i, t);
}

function family(t) {
  const i = Math.min(2, Math.floor((t - 8.5) / BEAT)), t0 = 8.5 + i * BEAT;
  const bgs = [CREAM, INK, PINK], cols = [PINK, GOLD, CREAM], shs = [INK, PINK, INK];
  fill(bgs[i]);
  const w = CONFIG.family[i], size = fit(w, '400 $px Anton', 960, 420);
  for (const d of [-1, 1]) for (const n of [1, 2, 3]) T(w, W / 2, 900 + d * n * size * .9, { t, size, align: 'center', stroke: cols[i], lw: 3, alpha: .4 / n });
  T(w, W / 2, 900, { t, t0, anim: 'slam', size, align: 'center', color: cols[i], shadow: shs[i] });
}

function hero(t) {
  const g = ctx.createRadialGradient(W / 2, 980, 0, W / 2, 980, 1100);
  g.addColorStop(0, PINK); g.addColorStop(1, PLUM);
  fill(g);
  band(470, -.2, 150, GOLD, CONFIG.band1, INK, 420, t);
  band(1480, .14, 150, INK, CONFIG.band2, GOLD, -420, t);
  for (const s of sparkles) {
    const tw = Math.max(0, Math.sin(t * 6 + s.p));
    star(s.x, s.y, s.r * tw, t + s.p, CREAM);
  }
  const pulse = 1 + .05 * Math.exp(-sinceBeat(t) * 10);
  const k = easeOutBack(seg(t, 10.0, 10.3));
  drawBottle(W / 2, 1060, .95 * k * pulse, { rot: Math.sin(t * Math.PI) * .07, sweep: seg(t, 10.3, 10.9) || -1, outline: GOLD });
}

function cta(t) {
  fill(GOLD);
  // rayures diagonales en mouvement
  ctx.save(); ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.translate(W / 2, H / 2); ctx.rotate(-.5);
  const off = (t * 120) % 160;
  for (let x = -1600; x < 1600; x += 160) ctx.fillRect(x + off, -1600, 60, 3200);
  ctx.restore();

  const lt = t - 11.5;
  T(CONFIG.brandAr, W / 2, 200, { t, t0: 11.5, anim: 'pop', size: 96, fam: 'Amiri', weight: 700, align: 'center', color: INK });
  T(CONFIG.brand, W / 2, 300, { t, t0: 11.55, anim: 'up', size: 62, align: 'center', color: INK, spacing: 22 });

  const pulse = 1 + .04 * Math.exp(-sinceBeat(t) * 10) * seg(t, 12, 12.2);
  const kb = easeOutBack(seg(t, 11.5, 11.8));
  drawBottle(W / 2, 760 + Math.sin(t * Math.PI * 2) * 8, .58 * kb * pulse, { rot: Math.sin(t * Math.PI) * .05, sweep: seg(t, 12.6, 13.1) || -1 });

  const s1 = fit(CONFIG.cta1, '400 $px Anton', 940, 240);
  T(CONFIG.cta1, W / 2, 1000, { t, t0: 11.6, anim: 'slam', size: s1, align: 'center', color: INK, shadow: PINK });
  T(CONFIG.cta2, W / 2, 1145, { t, t0: 11.85, anim: 'slam', size: 150, fam: 'Playfair Display', style: 'italic', weight: 900, align: 'center', color: PINK, shadow: CREAM, rot: -.06 });

  // bouton + tapotement
  const taps = [13.0, 14.0];
  let press = 1, ripple = -1;
  for (const tp of taps) {
    const d = t - tp;
    if (d >= 0 && d < .25) press = 1 - .07 * Math.sin(d / .25 * Math.PI);
    if (d >= 0 && d < .6) ripple = d / .6;
  }
  const kbtn = easeOutBack(seg(t, 12.1, 12.35));
  if (kbtn > 0) {
    const bw = 700, bh = 132, by = 1335, sc = kbtn * press * (1 + .03 * Math.exp(-sinceBeat(t) * 8) * seg(t, 12.4, 12.6));
    ctx.save(); ctx.translate(W / 2, by); ctx.scale(sc, sc);
    ctx.fillStyle = PINK; ctx.beginPath(); ctx.roundRect(-bw / 2 + 10, -bh / 2 + 12, bw, bh, bh / 2); ctx.fill();
    ctx.fillStyle = INK; ctx.beginPath(); ctx.roundRect(-bw / 2, -bh / 2, bw, bh, bh / 2); ctx.fill();
    ctx.font = '400 64px Anton'; ctx.letterSpacing = '4px'; ctx.fillStyle = GOLD; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(CONFIG.button, 2, 4);
    ctx.restore();
  }
  T(CONFIG.url, W / 2, 1460, { t, t0: 12.3, anim: 'up', size: 42, fam: 'Jost', weight: 500, align: 'center', color: INK, spacing: 2 });

  // doigt qui tape
  if (t > 12.5) {
    const arrive = easeOut(seg(t, 12.5, 12.95));
    const fx = lerp(1040, 830, arrive), fy = lerp(1800, 1385, arrive);
    ctx.save();
    if (ripple >= 0) {
      ctx.strokeStyle = `rgba(255,243,220,${1 - ripple})`; ctx.lineWidth = 8;
      ctx.beginPath(); ctx.arc(fx, fy, 40 + ripple * 120, 0, 6.28); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(255,243,220,.9)'; ctx.strokeStyle = INK; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(fx, fy, 34 * press, 0, 6.28); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  const ks = seg(t, 12.3, 12.5), wig = Math.sin(t * 9) * .04;
  if (CONFIG.price) {
    if (ks > 0) {
      ctx.save(); ctx.translate(860, 560); ctx.rotate(.2 + wig); ctx.scale(easeOutBack(ks), easeOutBack(ks));
      ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(8, 8, 130, 0, 6.28); ctx.fill();
      ctx.fillStyle = PINK; ctx.beginPath(); ctx.arc(0, 0, 130, 0, 6.28); ctx.fill();
      ctx.restore();
      T(CONFIG.price, 860, 560, { t, size: fit(CONFIG.price, '400 $px Anton', 200, 90), align: 'center', color: CREAM, rot: .2 + wig, alpha: easeOut(ks) });
    }
  } else pill(840, 520, CONFIG.sticker, { bg: PINK, color: CREAM, rot: .16 + wig, k: ks, size: 36 });
}

// ------------------------------------------------------------------
// Caméra : « punch » sur chaque coupe, secousses sur les impacts, flashs
// ------------------------------------------------------------------
const CUTS = [0, .5, 1, 1.5, 2, 2.25, 3, 4, 5.5, 7, 8.5, 9, 9.5, 10, 11.5];
const SHAKES = [1, 1.5, 2.25, 8.5, 9.5, 10, 11.6];
const FLASHES = [2.25, 8.5, 10, 11.5];
function lastOf(list, t) { let r = -99; for (const c of list) if (c <= t) r = c; return t - r; }

function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  const punch = 1 + .07 * Math.exp(-lastOf(CUTS, t) * 14);
  const ds = lastOf(SHAKES, t), amp = 22 * Math.exp(-ds * 12);
  ctx.translate(W / 2 + Math.sin(t * 97) * amp, H / 2 + Math.cos(t * 83) * amp);
  ctx.scale(punch, punch); ctx.translate(-W / 2, -H / 2);

  if (t < 2) hook(t);
  else if (t < 3) bottleDrop(t);
  else if (t < 4) nameCard(t);
  else if (t < 8.5) notes(t);
  else if (t < 10) family(t);
  else if (t < 11.5) hero(t);
  else cta(t);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const df = lastOf(FLASHES, t);
  if (df < .15) { ctx.fillStyle = `rgba(255,250,235,${.85 * (1 - df / .15)})`; ctx.fillRect(0, 0, W, H); }
}

// ------------------------------------------------------------------
// Lecture (boucle) ou rendu image par image (?render)
// ------------------------------------------------------------------
const FONTS = [
  ['Anton', 'fonts/anton.woff2', { weight: '400' }],
  ['Playfair Display', 'fonts/playfair-900i.woff2', { weight: '900', style: 'italic' }],
  ['Jost', 'fonts/jost-500.woff2', { weight: '500' }],
  ['Amiri', 'fonts/amiri-700-ar.woff2', { weight: '700' }],
];
window.ready = Promise.all(FONTS.map(([f, u, d]) => new FontFace(f, `url(${u})`, d).load().then(ff => document.fonts.add(ff))));
window.renderAt = t => draw(t);
window.DURATION = DUR;

if (!location.search.includes('render')) {
  window.ready.then(() => {
    let t0 = performance.now();
    cv.addEventListener('click', () => { t0 = performance.now(); });
    (function loop(now) {
      draw(((now - t0) / 1000) % DUR);
      requestAnimationFrame(loop);
    })(performance.now());
  });
}
</script>
